name: build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - ".gitignore"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: brew install tesseract
      - name: Build app bundle
        run: |
          set -euo pipefail
          TESSERACT="$(command -v tesseract)"
          TESSDATA="$(cd "$(dirname "$TESSERACT")/../share/tessdata" && pwd)"
          mkdir -p stage/tessdata
          cp "$TESSDATA/eng.traineddata" stage/tessdata/
          if [ -f "$TESSDATA/osd.traineddata" ]; then cp "$TESSDATA/osd.traineddata" stage/tessdata/; fi
          pyinstaller --noconfirm --clean --windowed \
            --name GoodCarCode \
            --osx-bundle-identifier com.local.GoodCarCode \
            --add-binary "$TESSERACT:tesseract" \
            --add-data "stage/tessdata:tesseract/tessdata" \
            app.py
      - name: Self test (bundled tesseract only)
        run: dist/GoodCarCode.app/Contents/MacOS/GoodCarCode --selftest --require-bundled
      - name: Zip app bundle
        run: ditto -c -k --keepParent dist/GoodCarCode.app GoodCarCode-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GoodCarCode-macos
          path: GoodCarCode-macos.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Install tesseract
        run: choco install tesseract --no-progress -y
      - name: Build exe
        shell: pwsh
        run: |
          $tess = "C:\Program Files\Tesseract-OCR"
          Copy-Item -Recurse -Force $tess ".tesseract-bundle"
          Get-ChildItem ".tesseract-bundle\tessdata\*.traineddata" |
            Where-Object { $_.Name -notin @("eng.traineddata", "osd.traineddata") } |
            Remove-Item -Force
          pyinstaller --noconfirm --clean --windowed --onefile `
            --name GoodCarCode `
            --add-data ".tesseract-bundle;tesseract" `
            app.py
      - name: Self test (bundled tesseract only)
        shell: pwsh
        run: |
          $env:PLATE_SELFTEST_LOG = "selftest.log"
          # 窗口版 exe 属于 GUI 子系统，直接 & 调用不会等待，必须 Start-Process -Wait
          $proc = Start-Process -FilePath "dist\GoodCarCode.exe" `
            -ArgumentList "--selftest", "--require-bundled" `
            -NoNewWindow -Wait -PassThru
          $code = $proc.ExitCode
          $lines = @()
          if (Test-Path selftest.log) {
            $lines = Get-Content selftest.log
            $lines
          }
          # GUI 子系统的退出码不可靠，以日志最后一行 ok 为准
          if ($lines.Count -eq 0 -or $lines[-1].Trim() -ne "ok") {
            throw "self-test did not finish (exit code $code)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: GoodCarCode-windows
          path: dist/GoodCarCode.exe

  release:
    # 只有推 v* tag 时才发布；普通 push 只构建和自检
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GoodCarCode-macos
      - uses: actions/download-artifact@v4
        with:
          name: GoodCarCode-windows
      - name: Append checksums to notes
        run: |
          {
            echo
            echo "## 校验下载是否完整（SHA-256）"
            echo
            echo '```'
            sha256sum GoodCarCode-macos.zip GoodCarCode.exe
            echo '```'
            echo
            echo "macOS：\`shasum -a 256 GoodCarCode-macos.zip\`；Windows：\`certutil -hashfile GoodCarCode.exe SHA256\`。"
          } >> NOTES.md
          cat NOTES.md
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME} 车牌筛选工具" \
            --notes-file NOTES.md \
            GoodCarCode-macos.zip GoodCarCode.exe
